[project]
name = "ghostjar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
bash-guard = "ghostjar.bash_guard:main"
# Alias: ~/.claude/settings.json invokes this name, so it stays available.
find-grep-guard = "ghostjar.bash_guard:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostjar"]
